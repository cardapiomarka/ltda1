        let activeCategory = 'salgados-fritos';

        // Generate navigation buttons
        function generateNavigation() {
            const navButtons = document.getElementById('nav-buttons');
            navButtons.innerHTML = '';
            
            Object.entries(categories).forEach(([key, category]) => {
                const button = document.createElement('button');
                button.className = `flex items-center px-4 py-2 rounded-full whitespace-nowrap transition-all duration-300 ${
                    activeCategory === key
                        ? 'bg-orange-500 text-white shadow-lg'
                        : 'bg-gray-100 text-gray-700 hover:bg-orange-100'
                }`;
                button.innerHTML = `
                    <span class="mr-2">${category.icon}</span>
                    ${category.title}
                `;
                button.onclick = () => setActiveCategory(key);
                navButtons.appendChild(button);
            });
        }

        // Generate content
        function generateContent() {
            const contentArea = document.getElementById('content-area');
            const category = categories[activeCategory];
            
            let html = `
                <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">
                    ${category.icon} ${category.title}
                </h2>
                <div class="space-y-8">
            `;

            category.items.forEach((section) => {
                html += `
                    <div class="border-l-4 border-orange-500 pl-6">
                        <h3 class="text-2xl font-semibold text-gray-800 mb-4 flex items-center">
                            <span class="bg-orange-500 text-white px-3 py-1 rounded-full text-sm mr-3">
                                ${section.type}
                            </span>
                            ${section.price ? `<span class="text-orange-600 text-xl font-bold">${section.price}</span>` : ''}
                        </h3>
                `;

                if (section.note) {
                    html += `
                        <div class="bg-yellow-100 border-yellow-400 border-l-4 p-3 mb-4">
                            <p class="text-yellow-700 font-medium">${section.note}</p>
                        </div>
                    `;
                }

                if (section.priceOptions) {
                    html += `
                        <div class="bg-blue-50 rounded-lg p-4 mb-4">
                            <h4 class="font-semibold text-blue-800 mb-2">Opções de preço:</h4>
                            ${section.priceOptions.map(option => `<div class="text-blue-700">• ${option}</div>`).join('')}
                        </div>
                    `;
                }

                html += '<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">';

                section.items.forEach((item) => {
                    if (typeof item === 'string') {
                        html += `
                            <div class="item-box rounded-lg p-3 hover:bg-orange-50 transition-colors">
                                <span class="text-gray-800">${item}</span>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="item-box rounded-lg p-3 hover:bg-orange-50 transition-colors flex justify-between items-center">
                                <span class="text-gray-800">${item.name}</span>
                                <span class="text-orange-600 font-bold">${item.price}</span>
                            </div>
                        `;
                    }
                });

                html += '</div></div>';
            });

            html += '</div>';
            contentArea.innerHTML = html;
        }

        // Set active category
        function setActiveCategory(category) {
            activeCategory = category;
            generateNavigation();
            generateContent();
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            generateNavigation();
            generateContent();
        });
